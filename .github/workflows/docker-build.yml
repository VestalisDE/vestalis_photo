name: Build & Push Docker Images (GHCR)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest

    env:
      APP_ENV: prod
      APP_DEBUG: 0

      # Dummy-Secrets für Symfony Kernel Boot
      APP_SECRET: "null"
      DATABASE_DSN: "sqlite:///:memory:"
      MAILER_ADR: "null"
      MAILER_DSN: "null://null"
      MAILER_USR: "null"
      REDIS_DSN: "redis://localhost:6379"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_mysql, zip, gd, redis
          tools: composer

      - name: Install Composer dependencies
        working-directory: frontend
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --optimize-autoloader \
            --no-scripts

      - name: Build Symfony frontend assets
        working-directory: frontend
        run: |
          php bin/console importmap:install --no-interaction
          php bin/console asset-map:compile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Compute build version
        id: version
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0")
          
          CLEAN_TAG=${TAG#v}
          
          MAJOR=$(echo "$CLEAN_TAG" | cut -d. -f1)
          MINOR=$(echo "$CLEAN_TAG" | cut -d. -f2)

          COMMIT_TS=$(git log -1 --format=%ct)
          
          DAY_OF_YEAR=$(date -u -d "@$COMMIT_TS" +%j | sed 's/^0*//')
          
          MINUTES_OF_DAY=$(date -u -d "@$COMMIT_TS" +%H\ %M | awk '{print ($1 * 60) + $2}')
          
          VERSION="${CLEAN_TAG}.${DAY_OF_YEAR}.${MINUTES_OF_DAY}"
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "MAJOR=$MAJOR" >> $GITHUB_OUTPUT
          echo "MINOR=$MAJOR.$MINOR" >> $GITHUB_OUTPUT

      # MAIN BUILD
      - name: Build & push frontend image (main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/docker/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/vestalisde/vestalis_photo-frontend:latest
            ghcr.io/vestalisde/vestalis_photo-frontend:${{ steps.version.outputs.VERSION }}
            ghcr.io/vestalisde/vestalis_photo-frontend:${{ steps.version.outputs.MINOR }}
            ghcr.io/vestalisde/vestalis_photo-frontend:${{ steps.version.outputs.MAJOR }}
          build-args: |
            APP_BUILD_VERSION=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/VestalisDE/vestalis_photo
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}

      # DEVELOP BUILD
      - name: Build & push frontend image (develop)
        if: github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/docker/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/vestalisde/vestalis_photo-frontend:dev
            ghcr.io/vestalisde/vestalis_photo-frontend:dev-${{ steps.version.outputs.MINOR }}
          build-args: |
            APP_BUILD_VERSION=${{ steps.version.outputs.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/VestalisDE/vestalis_photo
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}

